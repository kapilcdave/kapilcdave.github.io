<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000000;
            cursor: grab;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        body.dragging {
            cursor: grabbing;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        #hidden-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="hidden-canvas"></canvas>
    <div id="canvas-container"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let mainSphere, faceParticles;
        let isDragging = false;
        let previousMouseX = 0, previousMouseY = 0;
        let rotationVelocityX = 0, rotationVelocityY = 0;
        let autoRotation = 0;
        
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: false,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            mainSphere = createParticleSphere(2, 3000);
            scene.add(mainSphere);
            
            // Load image and create face particles
            loadImageAndCreateFace();
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('wheel', onMouseWheel, { passive: false });
            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('mouseleave', onMouseUp);
            
            animate();
        }
        
        function createParticleSphere(radius, count) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            
            for (let i = 0; i < count; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);
                
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.02,
                color: 0xffffff,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            });
            
            return new THREE.Points(geometry, material);
        }
        
        function loadImageAndCreateFace() {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = function() {
                const canvas = document.getElementById('hidden-canvas');
                const ctx = canvas.getContext('2d');
                
                // Set canvas size
                const targetWidth = 100;
                const targetHeight = Math.floor(img.height * (targetWidth / img.width));
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                
                // Draw image
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                
                // Get image data
                const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
                const pixels = imageData.data;
                
                const positions = [];
                const scale = 0.03;
                const offsetX = -targetWidth * scale / 2;
                const offsetY = targetHeight * scale / 2;
                
                // Sample pixels and create particles based on brightness
                for (let y = 0; y < targetHeight; y++) {
                    for (let x = 0; x < targetWidth; x++) {
                        const i = (y * targetWidth + x) * 4;
                        const r = pixels[i];
                        const g = pixels[i + 1];
                        const b = pixels[i + 2];
                        const brightness = (r + g + b) / 3;
                        
                        // Create particles for darker areas (the face)
                        if (brightness < 150) {
                            positions.push(
                                x * scale + offsetX,
                                -y * scale + offsetY,
                                0
                            );
                        }
                    }
                }
                
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                
                const material = new THREE.PointsMaterial({
                    size: 0.03,
                    color: 0xffffff,
                    transparent: true,
                    opacity: 1,
                    sizeAttenuation: true
                });
                
                faceParticles = new THREE.Points(geometry, material);
                mainSphere.add(faceParticles);
            };
            
            // Load the image from uploads
            img.src = '/mnt/user-data/uploads/1769470544092_image.png';
        }
        
        function onMouseDown(event) {
            isDragging = true;
            previousMouseX = event.clientX;
            previousMouseY = event.clientY;
            document.body.classList.add('dragging');
        }
        
        function onMouseMove(event) {
            if (!isDragging) return;
            
            const deltaX = event.clientX - previousMouseX;
            const deltaY = event.clientY - previousMouseY;
            
            rotationVelocityY = deltaX * 0.005;
            rotationVelocityX = deltaY * 0.005;
            
            mainSphere.rotation.y += rotationVelocityY;
            mainSphere.rotation.x += rotationVelocityX;
            
            previousMouseX = event.clientX;
            previousMouseY = event.clientY;
        }
        
        function onMouseUp() {
            isDragging = false;
            document.body.classList.remove('dragging');
        }
        
        function onMouseWheel(event) {
            event.preventDefault();
            camera.position.z += event.deltaY * 0.005;
            camera.position.z = Math.max(1, Math.min(15, camera.position.z));
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            autoRotation += 0.001;
            
            if (!isDragging) {
                mainSphere.rotation.y = autoRotation + rotationVelocityY;
                mainSphere.rotation.x += rotationVelocityX;
                rotationVelocityY *= 0.95;
                rotationVelocityX *= 0.95;
            } else {
                autoRotation = mainSphere.rotation.y;
            }
            
            renderer.render(scene, camera);
        }
        
        init();
    </script>
</body>
</html>
