            animation: blink 1s step-end infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Navigation link style */
        .nav-link {
            color: #fff;
            text-decoration: none;
            padding: 2px 4px;
            display: inline-block;
        }
        .nav-link:hover {
            background-color: #fff;
            color: #000;
        }

            text-decoration: none; color: white; display: inline-block; padding: 2px 4px;
        }
        .project-title-link:hover { background-color: #fff; color: #000; }
        .video-container {
            position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden;
            width: 100%; border: 2px solid #555;
        }
        .video-container:hover { border-color: #fff; }
        .video-container iframe {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }

        /* Style for Instagram embeds */
        .instagram-media {
            background: #000 !important;
            border: 2px solid #333 !important;

            margin: 0 auto !important;
            max-width: 400px !important;
