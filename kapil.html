    <title>Kapil Dave</title>
    <link href="https://fonts.googleapis.com/css2?family=Adwaita:wght@400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: 'Adwaita', monospace;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        main {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        .avatar {
            width: 320px;
            height: 320px;
            object-fit: cover;
            margin-bottom: 32px;
            border: 1px solid #222;
        }

        h1,
        p {
            font-size: 24px;
            /* Larger consistent font size */
            font-weight: 400;
            margin-bottom: 8px;
            color: #fff;
            line-height: 1.4;
        }

        p {
            color: #888;
            margin-bottom: 32px;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .links a {
            color: #666;
            transition: color 0.2s;
        }

        .links a:hover {
            color: #fff;
        }

        .links svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }
    </style>
</head>
